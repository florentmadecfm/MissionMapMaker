<!doctype html>
<!-- @dsCard group="Type" name="Display Scale" subtitle="h1 · h2 · h3 · h4 · lead" viewport="700x280" -->
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  .card { padding: 24px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: grid; grid-template-columns: 60px 1fr 60px; align-items: baseline; gap: 16px; }
  .sz { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .wt { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); text-align: right; }
  .line { color: var(--hive-800); }
</style></head>
<body><div class="card">
  <div class="row"><span class="sz">48 / 56</span><span class="line" style="font-size:48px; line-height:1.15; font-weight:600; letter-spacing:-.02em;">Un outil, une équipe.</span><span class="wt">h1 · 600</span></div>
  <div class="row"><span class="sz">38 / 48</span><span class="line" style="font-size:38px; line-height:1.15; font-weight:600; letter-spacing:-.02em;">Bienvenue dans la ruche</span><span class="wt">h2 · 600</span></div>
  <div class="row"><span class="sz">30 / 40</span><span class="line" style="font-size:30px; line-height:1.3; font-weight:600;">Mes projets en cours</span><span class="wt">h3 · 600</span></div>
  <div class="row"><span class="sz">24 / 32</span><span class="line" style="font-size:24px; line-height:1.3; font-weight:600;">Rejoindre une équipe</span><span class="wt">h4 · 600</span></div>
  <div class="row"><span class="sz">20 / 28</span><span class="line" style="font-size:20px; line-height:1.3; color:var(--fg-2); font-weight:400;">Sous-titre ou introduction courte</span><span class="wt">lead · 400</span></div>
</div></body></html>
