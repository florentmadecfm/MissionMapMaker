<!doctype html>
<!-- @dsCard group="Spacing" name="Shadows" subtitle="Two-level warm elevation" viewport="700x180" -->
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  .card { padding: 32px; background: var(--cream); }
  .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px; }
  .el {
    background: var(--paper);
    border-radius: var(--radius-lg);
    padding: 22px;
    text-align: center;
  }
  .el.s1 { box-shadow: var(--shadow-1); }
  .el.s2 { box-shadow: var(--shadow-2); }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .label { font-size: 14px; font-weight: 600; color: var(--fg-1); margin-bottom: 4px; }
  .desc { font-size: 12px; color: var(--fg-2); margin-top: 6px; }
</style></head>
<body><div class="card">
  <div class="row">
    <div class="el s1">
      <div class="label">Shadow 1</div>
      <div class="tok">--shadow-1</div>
      <div class="desc">Cards, tiles, rest state</div>
    </div>
    <div class="el s2">
      <div class="label">Shadow 2</div>
      <div class="tok">--shadow-2</div>
      <div class="desc">Menus, popovers, dialogs</div>
    </div>
  </div>
</div></body></html>
