<!doctype html>
<!-- @dsCard group="Type" name="Accents & Weights" subtitle="French accents + full weight range" viewport="700x220" -->
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  .card { padding: 28px; display: flex; flex-direction: column; gap: 10px; }
  .specimen { font-size: 72px; line-height: 1; color: var(--hive-800); font-weight: 600; letter-spacing: -.02em; }
  .accents { font-size: 22px; color: var(--fg-2); font-weight: 400; }
  .weights { display: flex; gap: 18px; font-size: 20px; color: var(--hive); margin-top: 4px; }
  .weights span { display: block; }
  .w3 { font-weight: 300; } .w4 { font-weight: 400; } .w5 { font-weight: 500; } .w6 { font-weight: 600; } .w7 { font-weight: 700; }
</style></head>
<body><div class="card">
  <div class="specimen">Aa Éé Àà Îî</div>
  <div class="accents">« Français » — ça, œuvre, cœur, naïve, être, où</div>
  <div class="weights">
    <span class="w3">Light 300</span>
    <span class="w4">Regular 400</span>
    <span class="w5">Medium 500</span>
    <span class="w6">Semibold 600</span>
    <span class="w7">Bold 700</span>
  </div>
</div></body></html>
