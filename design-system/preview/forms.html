<!doctype html>
<!-- @dsCard group="Components" name="Form Inputs" subtitle="Text fields + checkbox with honey focus ring" viewport="700x200" -->
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  .card { padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .field label { display: block; font-size: 13px; font-weight: 500; color: var(--fg-1); margin-bottom: 6px; }
  .field input, .field textarea {
    width: 100%;
    font-family: var(--font-sans);
    font-size: 15px;
    padding: 10px 14px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    background: var(--paper);
    color: var(--fg-1);
    box-sizing: border-box;
    outline: none;
    transition: border-color 150ms;
  }
  .field input:focus { border-color: var(--honey); box-shadow: 0 0 0 3px rgba(232,208,0,.25); }
  .field .hint { font-size: 12px; color: var(--fg-3); margin-top: 4px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .chk { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--fg-1); }
  .chk input { accent-color: var(--honey); width: 18px; height: 18px; }
</style></head>
<body><div class="card">
  <div class="row">
    <div class="field">
      <label>Nom de la ruche</label>
      <input placeholder="ex. Équipe radars nouvelle gen" value="Équipe Falcon">
    </div>
    <div class="field">
      <label>Courriel</label>
      <input placeholder="vous@thales.fr" type="email">
    </div>
  </div>
  <div class="chk"><input type="checkbox" checked> Rendre cette ruche visible par toute l'équipe</div>
</div></body></html>
