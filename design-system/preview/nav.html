<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  .card { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .nav {
    height: 56px;
    background: var(--cream);
    border-bottom: 1px solid var(--border);
    border-radius: var(--radius-md) var(--radius-md) 0 0;
    display: flex; align-items: center; padding: 0 18px; gap: 24px;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -.01em; color: var(--hive); }
  .brand img { height: 32px; width: auto; }
  .items { display: flex; gap: 18px; font-size: 14px; color: var(--fg-2); }
  .items a { color: var(--fg-2); text-decoration: none; padding: 4px 0; font-weight: 500; }
  .items a.active { color: var(--hive); border-bottom: 2px solid var(--honey); padding-bottom: 2px; }
  .spacer { flex: 1; }
  .btn { background: var(--honey); color: var(--on-accent); font-weight: 500; padding: 8px 14px; border-radius: var(--radius-md); font-size: 13px; }
  .search { background: var(--paper); border: 1px solid var(--border); padding: 6px 12px; border-radius: var(--radius-pill); font-size: 13px; color: var(--fg-3); width: 180px; }
  .tabs { display: flex; gap: 4px; padding: 0 18px; border-bottom: 1px solid var(--border); }
  .tab { padding: 10px 14px; font-size: 13px; color: var(--fg-2); font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: var(--hive); border-bottom-color: var(--hive); }
</style></head>
