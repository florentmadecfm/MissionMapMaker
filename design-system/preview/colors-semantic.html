<!doctype html>
<!-- @dsCard group="Colors" name="Semantic Colors" subtitle="Success · Warning · Danger · Info" viewport="700x170" -->
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  .card { padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sem {
    border-radius: var(--radius-md);
    padding: 14px;
    border: 1px solid var(--border);
    background: var(--bg-2);
  }
  .dot { width: 28px; height: 28px; border-radius: 8px; margin-bottom: 10px; }
  .sem .name { font-weight: 600; font-size: 13px; color: var(--fg-1); }
  .sem .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); margin-top: 2px; }
  .sem .use { font-size: 11px; color: var(--fg-2); margin-top: 6px; }
</style></head>
<body><div class="card">
  <div class="row">
    <div class="sem">
      <div class="dot" style="background:var(--success);"></div>
      <div class="name">Success</div><div class="hex">#2E7D5B</div>
      <div class="use">Enregistré · Validé</div>
    </div>
    <div class="sem">
      <div class="dot" style="background:var(--warning);"></div>
      <div class="name">Warning</div><div class="hex">#C78A17</div>
      <div class="use">Attention · Non enregistré</div>
    </div>
    <div class="sem">
      <div class="dot" style="background:var(--danger);"></div>
      <div class="name">Danger</div><div class="hex">#B5342B</div>
      <div class="use">Erreur · Supprimer</div>
    </div>
    <div class="sem">
      <div class="dot" style="background:var(--info);"></div>
      <div class="name">Info</div><div class="hex">#2A6FB0</div>
      <div class="use">Astuce · Nouveau</div>
    </div>
  </div>
</div></body></html>
