<!doctype html>
<!-- @dsCard group="Type" name="Type Family" subtitle="Liberation Sans — spécimen display" viewport="700x180" -->
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  .card { padding: 28px; }
  .display { font-size: 64px; line-height: 1; font-weight: 600; letter-spacing: -.02em; color: var(--hive-800); margin: 0; }
  .meta { display: flex; gap: 20px; margin-top: 16px; font-size: 12px; color: var(--fg-2); font-family: var(--font-mono); }
  .meta span strong { color: var(--fg-1); font-family: var(--font-sans); font-weight: 600; margin-right: 4px; }
</style></head>
<body><div class="card">
  <p class="display">Liberation Sans</p>
  <div class="meta">
    <span><strong>Family</strong>sans-serif</span>
    <span><strong>Weights</strong>300 · 400 · 500 · 600 · 700</span>
    <span><strong>Source</strong>System font · PDF-safe</span>
  </div>
</div></body></html>
