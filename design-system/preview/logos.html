<!doctype html>
<!-- @dsCard group="Brand" name="Logos" subtitle="Logo on cream, honey, and hive backgrounds" viewport="700x220" -->
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  .card {
    padding: 24px;
    display: flex; flex-direction: column; justify-content: center;
    min-height: 100%;
    box-sizing: border-box;
  }
  .logo-row {
    display: flex; gap: 20px; align-items: center;
  }
  .logo-cell {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 20px;
    border-radius: var(--radius-md);
  }
  .logo-cell img { height: 110px; width: auto; display: block; }
  .logo-cell.cream { background: var(--cream); border: 1px solid var(--border); }
  .logo-cell.hive { background: var(--hive); }
  .logo-cell.honey { background: var(--honey); }
  .logo-cell .label {
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--fg-2); font-weight: 600;
  }
  .logo-cell.hive .label, .logo-cell.honey .label { color: var(--hive); }
  .logo-cell.hive .label { color: rgba(255,255,255,.7); }
</style></head>
