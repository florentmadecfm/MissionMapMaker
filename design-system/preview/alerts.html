<!doctype html>
<!-- @dsCard group="Components" name="Alerts" subtitle="Success · Warning · Danger · Info" viewport="700x280" -->
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  .card { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .alert {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 14px 16px; border-radius: var(--radius-md);
    font-size: 14px; line-height: 1.5;
  }
  .alert .ic { width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; }
  .alert strong { display: block; font-weight: 600; margin-bottom: 2px; }
  .a-success { background: var(--success-soft); color: var(--success); }
  .a-warning { background: var(--warning-soft); color: var(--warning); }
  .a-danger { background: var(--danger-soft); color: var(--danger); }
  .a-info { background: var(--info-soft); color: var(--info); }
  .a-success strong, .a-warning strong, .a-danger strong, .a-info strong { color: inherit; }
  .body { color: var(--fg-1); opacity: .9; }
</style></head>
<body><div class="card">
  <div class="alert a-success"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg><div><strong>Enregistré.</strong><span class="body">Vos modifications sont synchronisées.</span></div></div>
  <div class="alert a-warning"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg><div><strong>Modifications non enregistrées.</strong><span class="body">Appuyez sur « Enregistrer » pour conserver vos changements.</span></div></div>
  <div class="alert a-danger"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg><div><strong>Impossible d'enregistrer.</strong><span class="body">Vérifiez votre connexion et réessayez.</span></div></div>
  <div class="alert a-info"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div><strong>Astuce.</strong><span class="body">Invitez vos collègues depuis les paramètres de la ruche.</span></div></div>
</div></body></html>
