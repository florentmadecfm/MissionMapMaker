<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing Scale" subtitle="4px base — 10 tokens" viewport="700x360" -->
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  .card { padding: 24px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: grid; grid-template-columns: 60px 1fr; align-items: center; gap: 14px; }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .bar { background: var(--honey); height: 18px; border-radius: 4px; }
  .val { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); margin-left: 10px; }
  .line { display: flex; align-items: center; }
</style></head>
<body><div class="card">
  <div class="row"><span class="tok">--space-1</span><div class="line"><div class="bar" style="width:4px;"></div><span class="val">4 px</span></div></div>
  <div class="row"><span class="tok">--space-2</span><div class="line"><div class="bar" style="width:8px;"></div><span class="val">8 px</span></div></div>
  <div class="row"><span class="tok">--space-3</span><div class="line"><div class="bar" style="width:12px;"></div><span class="val">12 px</span></div></div>
  <div class="row"><span class="tok">--space-4</span><div class="line"><div class="bar" style="width:16px;"></div><span class="val">16 px</span></div></div>
  <div class="row"><span class="tok">--space-5</span><div class="line"><div class="bar" style="width:24px;"></div><span class="val">24 px</span></div></div>
  <div class="row"><span class="tok">--space-6</span><div class="line"><div class="bar" style="width:32px;"></div><span class="val">32 px</span></div></div>
  <div class="row"><span class="tok">--space-7</span><div class="line"><div class="bar" style="width:40px;"></div><span class="val">40 px</span></div></div>
  <div class="row"><span class="tok">--space-8</span><div class="line"><div class="bar" style="width:48px;"></div><span class="val">48 px</span></div></div>
  <div class="row"><span class="tok">--space-9</span><div class="line"><div class="bar" style="width:64px;"></div><span class="val">64 px</span></div></div>
  <div class="row"><span class="tok">--space-10</span><div class="line"><div class="bar" style="width:80px;"></div><span class="val">80 px</span></div></div>
</div></body></html>
