# Build les binaires autonomes (API + interface embarquées via go:embed,
# voir ADR-031) pour Linux, Windows et macOS, et les publie en pièces
# jointes de la release GitHub correspondante. Permet de récupérer un
# exécutable prêt à l'emploi sans avoir Go ni Node.js installés
# localement (voir ADR-033).
name: Release des binaires autonomes

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build du frontend (web/dist)
        run: |
          cd web
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist

  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          - goos: darwin
            goarch: amd64
            suffix: macos-amd64
          - goos: darwin
            goarch: arm64
            suffix: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/dist
      - name: Build du binaire ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o bin/missionmapmaker-${{ matrix.suffix }} ./cmd/server
      - name: Publier sur la release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/missionmapmaker-${{ matrix.suffix }}
      - name: Archiver le binaire (déclenchement manuel)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: missionmapmaker-${{ matrix.suffix }}
          path: bin/missionmapmaker-${{ matrix.suffix }}
