<!doctype html>
<!-- @dsCard group="Brand" name="Tone of Voice" subtitle="Oui / Non — micro-copy examples" viewport="700x260" -->
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  .card { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .sample { background: var(--paper); padding: 14px 16px; border-radius: var(--radius-md); border: 1px solid var(--border); font-size: 14px; color: var(--fg-1); line-height: 1.55; }
  .sample.bad { background: #FBF1EC; color: #8A4536; position: relative; }
  .tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; margin-right: 8px; vertical-align: middle; }
  .ok { background: var(--success-soft); color: var(--success); }
  .no { background: var(--danger-soft); color: var(--danger); }
</style></head>
<body><div class="card">
  <div class="sample"><span class="tag ok">Oui</span>Bienvenue dans la ruche !</div>
  <div class="sample bad"><span class="tag no">Non</span>Welcome to The Hive™ 🎉🐝</div>
  <div class="sample"><span class="tag ok">Oui</span>Enregistré.</div>
  <div class="sample bad"><span class="tag no">Non</span>Yay! Saved successfully! 🎉</div>
  <div class="sample"><span class="tag ok">Oui</span>Nous travaillons mieux ensemble.</div>
  <div class="sample bad"><span class="tag no">Non</span>Unlock your team's full potential!</div>
</div></body></html>
